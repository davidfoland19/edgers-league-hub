name: Update league data
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_static.py
      - run: |
          git config user.name "league-hub-bot"
          git config user.email "league-hub-bot@users.noreply.github.com"
          git add data/static.json
          git diff --cached --quiet || (git commit -m "Update league data" && git push)
